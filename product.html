  <script id="tailwind-config">

    }, fontFamily: { "display": ["Space Grotesk"], "body": ["Inter"] } } } }
  </script>
  <style>
    .kinetic-grid { background-image: linear-gradient(to right, rgba(236, 215, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(236, 215, 255, 0.03) 1px, transparent 1px); background-size: 40px 40px; }

<body class="bg-surface font-body text-on-surface">
  <header class="bg-[#0c1322]/80 backdrop-blur-xl top-0 sticky z-[60] border-b border-white/5">
    <div class="flex justify-between items-center px-6 lg:px-8 py-4 w-full max-w-screen-2xl mx-auto font-display tracking-tight">
      <a href="index.html" class="text-2xl font-bold tracking-tighter text-transparent bg-clip-text bg-gradient-to-br from-purple-200 to-purple-400">

    </div>

  <main class="relative kinetic-grid min-h-screen pb-20">
    
    <!-- Hero / Top Section -->

      <!-- Single Large Image (Left) -->
      <div class="lg:col-span-7">
        <div class="relative aspect-square lg:aspect-[4/3] overflow-hidden rounded-2xl border border-outline-variant/20 bg-surface-container shadow-2xl">
          <img id="main-image" class="w-full h-full object-cover" />
        </div>
      </div>

      <!-- Core Details (Right) No Box -->
      <div class="lg:col-span-5 flex flex-col justify-center space-y-6">
        <h1 id="product-name" class="text-4xl lg:text-5xl font-display font-bold tracking-tighter text-on-surface"></h1>
        
        <!-- Star Score & Price Row -->
        <div class="flex flex-col gap-2">
          <div id="product-score-stars" class="flex items-center gap-1"></div>
          <div id="product-price" class="text-2xl font-display font-bold text-primary"></div>
        </div>

        <p id="product-meta-desc" class="text-on-surface-variant text-lg leading-relaxed pt-2"></p>
        
        <!-- Buy Links Flex Container -->
        <div class="pt-6">
          <h4 class="text-xs font-bold uppercase tracking-widest text-outline mb-3">Buy Here:</h4>
          <div id="order-row" class="flex flex-wrap gap-3"></div>
        </div>
      </div>
    </section>

        <div class="lg:col-span-8 space-y-6">
          <h2 class="text-3xl font-display font-bold tracking-tight text-primary border-b border-white/5 pb-4">Overview</h2>
          <div id="product-detailed-desc" class="space-y-6 text-on-surface-variant leading-loose font-light text-lg"></div>
        </div>
        
        <div class="lg:col-span-4">
          <div class="bg-surface-container-low rounded-2xl p-8 border border-outline-variant/10">
            <h3 class="text-sm font-bold tracking-[0.3em] uppercase text-primary mb-8">Specifications</h3>
            <div id="product-specs-grid" class="flex flex-col gap-4 text-sm font-mono"></div>
          </div>
        </div>
      </div>

      <!-- 2. Pros & Cons -->
      <div id="pros-cons-section" class="mb-16"></div>

      <!-- 3. Dynamic Sub-Scores (Epic Games Style) -->
      <div id="subscores-wrapper" class="hidden mb-16">
        <h2 class="text-2xl font-display font-bold tracking-tight text-primary mb-6">Detailed Scoring</h2>
        <div id="subscores-grid" class="flex flex-wrap gap-6 items-center justify-start"></div>
