<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Loading Review...</title>
  <link rel="icon" type="image/x-icon" href="logo t.png"> 
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = { darkMode: "class", theme: { extend: { colors: {
      "primary-fixed-dim": "#dbb8ff", "background": "#0c1322", "surface-container-lowest": "#070e1d", "surface-container": "#191f2f",
      "on-surface": "#dce2f7", "surface-variant": "#2e3545", "surface": "#0c1322", "surface-container-low": "#141b2b",
      "outline": "#968e9a", "on-surface-variant": "#cdc3d0", "primary-fixed": "#efdbff", "surface-container-high": "#232a3a",
      "primary": "#ecd7ff", "primary-container": "#d8b4fe", "outline-variant": "#4a454f"
    }, fontFamily: { "display": ["Space Grotesk"], "body": ["Inter"] } } } }
  </script>
  <style>
    .kinetic-grid { background-image: linear-gradient(to right, rgba(236, 215, 255, 0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(236, 215, 255, 0.05) 1px, transparent 1px); background-size: 40px 40px; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
    @keyframes shimmer-sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    .shimmer-skeleton { position: relative !important; overflow: hidden !important; background-color: #141b2b !important; }
    .shimmer-skeleton::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; transform: translateX(-100%); background-image: linear-gradient( 90deg, rgba(236, 215, 255, 0) 0%, rgba(236, 215, 255, 0.03) 20%, rgba(236, 215, 255, 0.12) 50%, rgba(236, 215, 255, 0.03) 80%, rgba(236, 215, 255, 0) 100% ); animation: shimmer-sweep 1.5s infinite ease-in-out; }
  </style>
</head>

<body class="bg-surface font-body text-on-surface selection:bg-primary-container selection:text-on-primary-container">
  <header class="bg-[#0c1322]/60 backdrop-blur-xl sticky top-0 z-[60] border-b border-white/5">
    <div class="flex justify-between items-center px-8 py-4 w-full max-w-screen-2xl mx-auto font-display tracking-tight">
      <a href="index.html" class="text-2xl font-bold tracking-tighter text-transparent bg-clip-text bg-gradient-to-br from-purple-200 to-purple-400">
        The Geek Shop Blog
      </a>
      <nav class="hidden md:flex items-center space-x-8">
        <a class="text-slate-400 hover:text-purple-200 transition-colors" href="products.html">All Reviews</a>
      </nav>
    </div>
  </header>

  <main class="relative kinetic-grid min-h-screen">
    <section id="product-section" class="max-w-screen-2xl mx-auto px-8 py-12 lg:py-20 grid grid-cols-1 lg:grid-cols-12 gap-16">
      <div class="lg:col-span-7 space-y-6">
        <div id="main-image-container" class="relative aspect-square lg:aspect-[4/3] overflow-hidden rounded-xl border border-outline-variant/10 shimmer-skeleton">
          <img id="main-image" class="w-full h-full object-cover transition-opacity duration-300 opacity-0" onload="this.classList.remove('opacity-0'); document.getElementById('main-image-container').classList.remove('shimmer-skeleton');" />
        </div>
        <div id="thumbnail-gallery" class="grid grid-cols-4 gap-4">
          <div class="aspect-square rounded-lg shimmer-skeleton"></div>
        </div>
      </div>

      <div class="lg:col-span-5 flex flex-col justify-center space-y-8">
        <div class="space-y-4">
          <h1 id="product-name" class="text-4xl lg:text-6xl font-display font-bold tracking-tighter leading-none text-transparent bg-clip-text bg-gradient-to-r from-on-surface to-primary-fixed-dim shimmer-skeleton min-h-[4rem] rounded-xl"></h1>
          <div id="product-price" class="price text-primary text-3xl font-display font-light flex items-center"></div>
        </div>
        <div class="space-y-6">
          <p id="product-meta-desc" class="text-on-surface-variant text-lg leading-relaxed max-w-md shimmer-skeleton min-h-[3rem] rounded-xl"></p>
          <div id="order-row" class="flex flex-col gap-4 pt-4">
             <div class="h-16 w-full rounded-xl shimmer-skeleton"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="max-w-screen-2xl mx-auto px-8 py-16 border-t border-outline-variant/10">
      <div id="pros-cons-section"></div> <!-- Injected via JS -->
      
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-20 mt-12">
        <div class="space-y-8">
          <h2 class="text-3xl font-display font-bold tracking-tight">The Detailed Review</h2>
          <div id="product-detailed-desc" class="space-y-6 text-on-surface-variant leading-loose font-light"></div>
        </div>
        
        <div class="bg-surface-container-low rounded-2xl p-10 border border-outline-variant/10 h-fit">
          <h3 class="text-sm font-bold tracking-[0.3em] uppercase text-primary mb-10">Technical Specifications</h3>
          <div id="product-specs-grid" class="grid grid-cols-1 gap-4"></div>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
