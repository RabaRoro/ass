<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Loading Review...</title>
  <link rel="icon" type="image/x-icon" href="logo t.png"> 
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <script id="tailwind-config">
    tailwind.config = { darkMode: "class", theme: { extend: { colors: {
      "primary-fixed-dim": "#dbb8ff", "background": "#0c1322", "surface-container-lowest": "#070e1d", "surface-container": "#191f2f",
      "on-surface": "#dce2f7", "surface-variant": "#2e3545", "surface": "#0c1322", "surface-container-low": "#141b2b",
      "outline": "#968e9a", "on-surface-variant": "#cdc3d0", "primary-fixed": "#efdbff", "surface-container-high": "#232a3a",
      "primary": "#ecd7ff", "outline-variant": "#4a454f"
    }, fontFamily: { "display": ["Space Grotesk"], "body": ["Inter"] } } } }
  </script>
  <style>
    .kinetic-grid { background-image: linear-gradient(to right, rgba(236, 215, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(236, 215, 255, 0.03) 1px, transparent 1px); background-size: 40px 40px; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
  </style>
</head>

<body class="bg-surface font-body text-on-surface">
  <header class="bg-[#0c1322]/80 backdrop-blur-xl top-0 sticky z-[60] border-b border-white/5">
    <div class="flex justify-between items-center px-6 lg:px-8 py-4 w-full max-w-screen-2xl mx-auto font-display tracking-tight">
      <a href="index.html" class="text-2xl font-bold tracking-tighter text-transparent bg-clip-text bg-gradient-to-br from-purple-200 to-purple-400">
        The Geek Shop Blog
      </a>
      <nav class="hidden md:flex items-center space-x-8">
        <a class="text-slate-400 hover:text-purple-200 transition-colors" href="products.html">All Reviews</a>
      </nav>
    </div>
  </header>

  <main class="relative kinetic-grid min-h-screen">
    <section class="max-w-screen-2xl mx-auto px-8 py-12 lg:py-20 grid grid-cols-1 lg:grid-cols-12 gap-16">
      <div class="lg:col-span-7 space-y-6">
        <div id="main-image-container" class="relative aspect-square lg:aspect-[4/3] overflow-hidden rounded-xl border border-outline-variant/20 bg-surface-container">
          <img id="main-image" class="w-full h-full object-cover transition-opacity duration-300" />
        </div>
        <div id="thumbnail-gallery" class="grid grid-cols-4 gap-4"></div>
      </div>

      <div class="lg:col-span-5 flex flex-col justify-center space-y-8 bg-surface/80 p-8 rounded-2xl border border-white/5 backdrop-blur-md">
        <div class="space-y-4">
          <h1 id="product-name" class="text-4xl lg:text-5xl font-display font-bold tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-on-surface to-primary-fixed-dim"></h1>
          <div id="product-price" class="text-primary text-3xl font-display font-bold flex items-center gap-2"></div>
        </div>
        <div class="space-y-6">
          <p id="product-meta-desc" class="text-on-surface-variant text-lg leading-relaxed"></p>
          <div id="order-row" class="flex flex-col gap-4 pt-4 border-t border-white/5"></div>
        </div>
      </div>
    </section>

    <section class="max-w-screen-2xl mx-auto px-8 py-16 border-t border-outline-variant/10">
      <div id="pros-cons-section"></div>
      
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-20 mt-12">
        <div class="space-y-8">
          <h2 class="text-3xl font-display font-bold tracking-tight text-primary">The Detailed Review</h2>
          <div id="product-detailed-desc" class="space-y-6 text-on-surface-variant leading-loose font-light text-lg"></div>
        </div>
        
        <div class="bg-surface-container-low rounded-2xl p-10 border border-outline-variant/10 h-fit">
          <h3 class="text-sm font-bold tracking-[0.3em] uppercase text-primary mb-10">Technical Specifications</h3>
          <div id="product-specs-grid" class="grid grid-cols-1 gap-4 text-sm font-mono"></div>
        </div>
      </div>
    </section>
  </main>
  
  <script type="module" src="script.js"></script>
</body>
</html>
