<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>All Reviews | The Geek Shop</title>
  <link rel="icon" type="image/x-icon" href="logo t.png"> 
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
    body { font-family: 'Inter', sans-serif; background-color: #0c1322; color: #dce2f7; overflow-x: hidden; }
    h1, h2, h3, .font-display { font-family: 'Space Grotesk', sans-serif; }
  </style>

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: { extend: { colors: {
            "surface-bright": "#323949", "surface-container": "#191f2f", "surface-variant": "#2e3545",
            "surface-container-low": "#141b2b", "surface": "#0c1322", "surface-container-high": "#232a3a", 
            "outline": "#968e9a", "background": "#0c1322", "surface-container-lowest": "#070e1d",
            "on-surface": "#dce2f7", "primary": "#ecd7ff"
      } } }
    }
  </script>
</head>

<body class="bg-background selection:bg-primary/30 min-h-screen flex flex-col">
  <header class="bg-[#0c1322]/80 backdrop-blur-xl top-0 sticky z-[60] border-b border-white/5">
    <!-- Updated Header: flex-wrap ensures the search bar neatly stacks on mobile views -->
    <div class="flex flex-wrap md:flex-nowrap justify-between items-center px-6 lg:px-8 py-4 w-full max-w-screen-2xl mx-auto gap-4 md:gap-8">
      
      <a href="index.html" class="flex flex-shrink-0 items-center gap-2 text-2xl font-bold tracking-tighter text-transparent bg-clip-text bg-gradient-to-br from-purple-200 to-purple-400 font-display">
        The Geek Shop Blog
      </a>
      
      <!-- Visible on mobile: Order changes to push it to a new row on small screens -->
      <div class="flex order-last md:order-none items-center relative w-full md:w-96 md:mx-auto">
        <span class="material-symbols-outlined absolute left-3 text-slate-500 text-sm">search</span>
        <input type="text" id="search-input" placeholder="Search reviews..." class="w-full bg-surface-container-lowest border border-white/5 rounded-xl pl-9 pr-4 py-2 text-sm text-on-surface focus:outline-none focus:border-primary/50 transition-all">
      </div>

      <nav class="hidden md:flex flex-shrink-0 items-center space-x-8 font-display tracking-tight">
        <a class="text-purple-300 border-b-2 border-purple-400 pb-1" href="products.html">All Reviews</a>
      </nav>
    </div>
  </header>

  <main class="flex-1 max-w-screen-2xl w-full mx-auto px-6 lg:px-8 py-8 lg:py-12">
    <!-- Added Grid Layout for Sidebar and Products -->
    <div class="flex flex-col lg:flex-row gap-8">
      
      <!-- Filters Sidebar -->
      <aside class="w-full lg:w-72 flex-shrink-0">
        <div class="bg-surface-container-low rounded-2xl p-6 border border-white/5 sticky top-28 space-y-6">
          <h2 class="text-xl font-display font-bold text-primary mb-4 flex items-center gap-2">
            <span class="material-symbols-outlined">filter_alt</span> Filters
          </h2>
          
          <!-- Price Range -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-widest text-outline mb-3">Price Range (৳)</label>
            <div class="flex items-center gap-3">
              <input type="number" id="filter-price-min" placeholder="Min" class="w-full bg-surface-container-lowest border border-white/10 rounded-xl px-4 py-2.5 text-sm text-on-surface focus:outline-none focus:border-primary/50 transition-all shadow-inner">
              <span class="text-outline text-sm">-</span>
              <input type="number" id="filter-price-max" placeholder="Max" class="w-full bg-surface-container-lowest border border-white/10 rounded-xl px-4 py-2.5 text-sm text-on-surface focus:outline-none focus:border-primary/50 transition-all shadow-inner">
            </div>
          </div>

          <!-- Keyboard Layout -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-widest text-outline mb-3">Keyboard Layout</label>
            <select id="filter-layout" class="w-full bg-surface-container-lowest border border-white/10 rounded-xl px-4 py-3 text-sm text-on-surface focus:outline-none focus:border-primary/50 transition-all cursor-pointer">
              <option value="">Any Layout</option>
            </select>
          </div>

          <!-- Connectivity -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-widest text-outline mb-3">Connectivity</label>
            <select id="filter-connectivity" class="w-full bg-surface-container-lowest border border-white/10 rounded-xl px-4 py-3 text-sm text-on-surface focus:outline-none focus:border-primary/50 transition-all cursor-pointer">
              <option value="">Any Connectivity</option>
            </select>
          </div>
          
        </div>
      </aside>

      <!-- Products Grid (Adjusted columns to account for sidebar) -->
      <div class="flex-1 min-w-0">
        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
          <!-- JS Injected Cards -->
        </div>
      </div>
      
    </div>
  </main>
  
  <script type="module" src="script.js"></script>
</body>
</html>
